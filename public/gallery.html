<body>
    <!-- here to create the website nav area/ <a = link / href = link destination.-->
    <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>

    <!-- 
    In CA1, this page worked like a static image gallery.
    In CA2, the page now loads products dynamically from the MySQL database.
    Because of that, I renamed the navigation section from Gallery to Products.
    -->
    <a href="gallery.html">Products</a>
    <a href="contact.html">Contact</a>     
    </nav>

    <h1>Products</h1> <!--main page title-->
    <p>Explore our elegant party dresses for special occasions</p>
    <!-- Gallery support text -->
<p>Our collection includes elegant looks for weddings, birthday celebrations, prom nights, and other special events.</p>




   <!-- In CA1, I wrote the dress images directly in this HTML page using <img> tags. -->
   <!-- For CA2, I am changing this page to be dynamic.
   <!- This means the products will come from the MySQL database instead of being hardcoded here.-->

   <!-- The images are NOT deleted from the project.-->
   <!-- They are still saved inside the images folder.
   <!-  The database stores the image file name, and JavaScript will use that name to display each dress.-->

<section class="products-section">

    <!-- This title introduces the product area of the website -->
    <h1>Our Dresses</h1>

    <!-- 
        This empty div is important.
        JavaScript will later fill this space with product cards from the database.
    -->
    <div id="products-container" class="products-container"></div>
    <!-- 
    This button takes the user to the cart page.
    I keep it here because the user may want to continue shopping first
    and only view the cart when they are ready.-->
    <a href="cart.html" class="view-cart-button">View Cart</a>

</section>

<!-- 
    I connect my JavaScript file here.
    This file will fetch the products from the server and display them on the page.
-->
<script src="script.js"></script>
